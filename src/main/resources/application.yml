spring:
    application:
        name: mcp-sidecar
    profiles:
        active: local

    ai:
        mcp:
            server:
                # 关闭自动装配的单个 MCP server(原 /mcp)。
                # 各模块的 MCP server 由 config/mcp 下的配置类按模块多端点手动装配。
                enabled: false
                # 关闭全局 @McpTool 扫描,工具由各模块配置类手动装配
                annotation-scanner:
                    enabled: false
#                endpoint: /mcp

    kafka:
        bootstrap-servers: localhost:9092
        producer:
            key-serializer: org.apache.kafka.common.serialization.StringSerializer
            value-serializer: org.apache.kafka.common.serialization.StringSerializer
    redis:
        # 默认不使用redis
        enabled: false

management:
    server:
        port: 9970
    endpoint:
        health:
            show-details: always
    endpoints:
        enabled-by-default: true
        web:
            base-path: /actuator
            exposure:
                include: '*'

logging:
    file:
        name: logs/${spring.application.name}/info.log

mybatis-plus:
    type-handlers-package: com.hx.gd.typehandler
    configuration:
        map-underscore-to-camel-case: true
    mapper-locations:
        - classpath:mappers/*.xml

server:
    compression:
        min-response-size: 1024
        enabled: true

springdoc:
    api-docs:
        enabled: true
        path: /v3/api-docs    # 默认即可，不建议改动，swagger UI 会自动请求这个地址
    swagger-ui:
        enabled: true
        path: /swagger-ui.html  # 默认UI路径
        operations-sorter: alpha   # 接口按字母排序
        tags-sorter: alpha         # tag排序
        display-request-duration: true  # 显示请求耗时

################### 大模型相关配置 ###############

# mcp服务器配置
mcp:
    servers:
        platform:
#            mcp服务 platform平台 地址
            baseUrl: http://10.0.0.5:9500/platform
#   mock数据开关:被 @MockData 标注的工具按此处的配置决定返回mock数据还是调真实接口
    mock:
#       总开关,true=工具默认返回mock数据(不再调用平台后端);false=全部走真实接口
        enabled: true
#       只mock这些工具(白名单),为空表示不启用白名单。工具名取 @McpTool 的 name
        include: []
#       这些工具走真实接口(黑名单)
        exclude: []
#       按工具名精确覆盖,优先级最高,true走mock/false走真实接口。工具名含冒号,必须加引号
        tools: {}
#           "device_query:getVendorDeviceList": false

# 大模型对话流量限制
llm:
#   对话最大限制人数
    limitSize: 10
#   python端agent接口地址
    wsPath:
#       智能体聊天
        chat: ws://127.0.0.1:8001/chat/%s/%s
#       文档生成
        gen_doc: ws://127.0.0.1:8001/gen_doc/%s/%s
    auth:
#        认证检查平台后端服务接口
        url: http://10.0.0.5:9500/platform/llmChat/auth?token=%s&userId=%s

################### 大模型相关配置 ###############