spring:
    application:
        name: mcp-sidecar
    profiles:
        active: local

    ai:
        mcp:
            server:
                # 关闭自动装配的单个 MCP server(原 /mcp)。
                # 各模块的 MCP server 由 config/mcp 下的配置类按模块多端点手动装配。
                enabled: false
                # 关闭全局 @McpTool 扫描,工具由各模块配置类手动装配
                annotation-scanner:
                    enabled: false
#                endpoint: /mcp

    kafka:
        bootstrap-servers: localhost:9092
        producer:
            key-serializer: org.apache.kafka.common.serialization.StringSerializer
            value-serializer: org.apache.kafka.common.serialization.StringSerializer
    # 注意：这里原本写的 spring.redis.enabled: false 是无效配置，
    # Spring 从来没有这个属性，redis 的自动装配也没有 enabled 开关。
    # 要"关掉 redis"请用下面的 management.health.redis.enabled。

management:
    server:
        port: 9970
    # redis 未被任何业务使用，关掉它的健康检查。
    # 不关的话，每次访问 /actuator/health 都会去连一次 redis，失败后
    # RedisReactiveHealthIndicator 打 WARN + 几十行堆栈，lettuce 还会持续重连刷日志。
    # （docker healthcheck 每 30s 打一次这个端点，于是 error.log 一直在涨）
    health:
        redis:
            enabled: false
    endpoint:
        health:
            show-details: always
    endpoints:
        enabled-by-default: true
        web:
            base-path: /actuator
            exposure:
                include: '*'

logging:
    file:
        name: logs/${spring.application.name}/info.log
    level:
        io.modelcontextprotocol.server.McpAsyncServer: ERROR


mybatis-plus:
    type-handlers-package: com.hx.gd.typehandler
    configuration:
        map-underscore-to-camel-case: true
    mapper-locations:
        - classpath:mappers/*.xml

server:
    compression:
        min-response-size: 1024
        enabled: true

springdoc:
    api-docs:
        enabled: true
        path: /v3/api-docs    # 默认即可，不建议改动，swagger UI 会自动请求这个地址
    swagger-ui:
        enabled: true
        path: /swagger-ui.html  # 默认UI路径
        operations-sorter: alpha   # 接口按字母排序
        tags-sorter: alpha         # tag排序
        display-request-duration: true  # 显示请求耗时

################### 大模型相关配置 ###############

# mcp服务器配置
mcp:
    # /mcp/** 的内网监听端口（server/local 均生效；docker-compose 只 expose 不 publish）
    internal-port: 2223
    servers:
        platform:
#            mcp服务 platform平台 地址
            baseUrl: http://10.0.0.5:9500/platform
        ragflow:
            baseUrl: http://localhost:9380    # RAGFlow API 地址
            apiKey: 123             # 网页"头像→API"创建
            datasetIds: "531584b4b01f11f19e1465040d524065"   # 可选，逗号分隔；留空=全库检索
#   mock数据开关:被 @MockData 标注的工具按此处的配置决定返回mock数据还是调真实接口
    mock:
#       总开关,true=工具默认返回mock数据(不再调用平台后端);false=全部走真实接口
        enabled: true
#       只mock这些工具(白名单),为空表示不启用白名单。工具名取 @McpTool 的 name
        include: []
#       这些工具走真实接口(黑名单)
        exclude: []
#       按工具名精确覆盖,优先级最高,true走mock/false走真实接口。工具名含冒号,必须加引号
        tools: {}
#           "device_query:getVendorDeviceList": false

# 大模型对话流量限制
llm:
#   对话最大限制人数
    limitSize: 10
#   python端agent接口地址
    wsPath:
#       智能体聊天
        chat: ws://127.0.0.1:8001/chat/%s/%s
#       文档生成
        gen_doc: ws://127.0.0.1:8001/gen_doc/%s/%s
    auth:
#        认证检查平台后端服务接口
        url: http://10.0.0.5:9500/platform/llmChat/auth?token=%s&userId=%s

################### 大模型相关配置 ###############