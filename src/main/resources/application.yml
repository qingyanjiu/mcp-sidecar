spring:
    config:
        import: optional:file:./.env[.properties]
    application:
        name: mcp-sidecar
    profiles:
        active: local

    ai:
        mcp:
            server:
                # 关闭自动装配的单个 MCP server(原 /mcp)。
                # 各模块的 MCP server 由 config/mcp 下的配置类按模块多端点手动装配。
                enabled: false
                # 关闭全局 @McpTool 扫描,工具由各模块配置类手动装配
                annotation-scanner:
                    enabled: false
#                endpoint: /mcp

    kafka:
        bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:}
        producer:
            key-serializer: org.apache.kafka.common.serialization.StringSerializer
            value-serializer: org.apache.kafka.common.serialization.StringSerializer
    # 注意：这里原本写的 spring.redis.enabled: false 是无效配置，
    # Spring 从来没有这个属性，redis 的自动装配也没有 enabled 开关。
    # 要"关掉 redis"请用下面的 management.health.redis.enabled。

management:
    server:
        # 管理端点只监听本机，容器内 healthcheck 走 127.0.0.1
        address: 127.0.0.1
        port: 9970
    # redis 未被任何业务使用，关掉它的健康检查。
    # 不关的话，每次访问 /actuator/health 都会去连一次 redis，失败后
    # RedisReactiveHealthIndicator 打 WARN + 几十行堆栈，lettuce 还会持续重连刷日志。
    # （docker healthcheck 每 30s 打一次这个端点，于是 error.log 一直在涨）
    health:
        redis:
            enabled: false
    endpoint:
        health:
            enabled: true
            # 不向未认证调用方展示组件明细
            show-details: never
        info:
            enabled: true
    endpoints:
        enabled-by-default: false
        web:
            base-path: /actuator
            exposure:
                # 只暴露探活和版本信息，env/heapdump/loggers 等默认关闭
                include: health,info

security:
    # 前端服务页面的 Origin 白名单，逗号分隔（如 http://10.0.0.6:8080）。
    # 默认留空；可在 application-local.yml / application-server.yml / deploy 配置中覆盖，
    # 也可用环境变量 SECURITY_ALLOWED_ORIGINS。留空时只允许与 sidecar 同主机的页面。
    allowed-origins: ${SECURITY_ALLOWED_ORIGINS:http://localhost:5173}

logging:
    file:
        name: logs/${spring.application.name}/info.log
    level:
        io.modelcontextprotocol.server.McpAsyncServer: ERROR


mybatis-plus:
    type-handlers-package: com.hx.gd.typehandler
    configuration:
        map-underscore-to-camel-case: true
    mapper-locations:
        - classpath:mappers/*.xml

server:
    compression:
        min-response-size: 1024
        enabled: true

springdoc:
    api-docs:
        enabled: true
        path: /v3/api-docs    # 默认即可，不建议改动，swagger UI 会自动请求这个地址
    swagger-ui:
        enabled: true
        path: /swagger-ui.html  # 默认UI路径
        operations-sorter: alpha   # 接口按字母排序
        tags-sorter: alpha         # tag排序
        display-request-duration: true  # 显示请求耗时

################### 大模型相关配置 ###############

# mcp服务器配置
mcp:
    # /mcp/** 的内网监听端口（server/local 均生效；docker-compose 只 expose 不 publish）
    internal-port: 2223
    # 内网端口的监听地址（SEC-08）。默认只绑回环；容器内由 compose 覆盖为 0.0.0.0，
    # 否则 agentic-app 无法通过服务名访问。
    internal-address: ${MCP_INTERNAL_ADDRESS:127.0.0.1}
    # /mcp/** 的应用层 API Key（SEC-08）。留空 = 所有 MCP 请求 401。
    # 客户端通过 Authorization: Bearer <key> 或 X-MCP-API-Key: <key> 携带。
    api-key: ${MCP_API_KEY:}
    # 单个 MCP 请求体的字节上限（SEC-06）；正常 initialize / tools/call 远小于此值。
    # 由 McpRequestSizeLimitFilter 在内网端口上强制执行，超限返回 413。
    max-request-size: 1048576
    servers:
        platform:
#            mcp服务 platform平台 地址
            baseUrl: ${MCP_PLATFORM_BASE_URL:}
#            平台登录凭据：真实值放 .env，不写进配置文件
            login-username: ${PLATFORM_LOGIN_USERNAME:}
            login-password: ${PLATFORM_LOGIN_PASSWORD:}
            login-type: ${PLATFORM_LOGIN_TYPE:1}
            captcha-id: ${PLATFORM_CAPTCHA_ID:}
            captcha-code: ${PLATFORM_CAPTCHA_CODE:}
            allow-plaintext-login: ${PLATFORM_ALLOW_PLAINTEXT_LOGIN:false}
        ragflow:
            baseUrl: ${MCP_RAGFLOW_BASE_URL:} # RAGFlow API 地址
            apiKey: ${MCP_RAGFLOW_API_KEY:} # 网页"头像→API"创建
            datasetIds: "531584b4b01f11f19e1465040d524065"   # 可选，逗号分隔；留空=全库检索
#   mock数据开关:被 @MockData 标注的工具按此处的配置决定返回mock数据还是调真实接口
    mock:
#       总开关,true=工具默认返回mock数据(不再调用平台后端);false=全部走真实接口
        enabled: true
#       只mock这些工具(白名单),为空表示不启用白名单。工具名取 @McpTool 的 name
        include: []
#       这些工具走真实接口(黑名单)
        exclude: []
#       按工具名精确覆盖,优先级最高,true走mock/false走真实接口。工具名含冒号,必须加引号
        tools: {}
#           "device_query:getVendorDeviceList": false

# 大模型对话流量限制
llm:
#   对话最大限制人数
    limitSize: 10
#   python端agent接口地址
    wsPath:
#       智能体聊天
        chat: ws://127.0.0.1:8001/chat/%s/%s
#       文档生成
        gen_doc: ws://127.0.0.1:8001/gen_doc/%s/%s
    auth:
#        认证检查平台后端服务接口
        url: ${LLM_AUTH_URL:}

################### 大模型相关配置 ###############
